
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n♡wal</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Georgia, 'Times New Roman', Times, serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            user-select: none;
        }

        
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(5px) brightness(0.5);
            transform: scale(1.05);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            pointer-events: none;
        }

        .bg-video.show {
            opacity: 1;
        }

        .cd-wrapper {
            position: fixed;
            z-index: 10;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.9s ease-in-out, opacity 0.9s ease-in-out;
        }

        .cd-image {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 4px;
        }

        .cd-wrapper.hide-left {
            transform: translateX(-180px);
            opacity: 0;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            pointer-events: none;
            padding: 20px;
        }

        .content.show {
            opacity: 1;
            pointer-events: auto;
        }

        h1 {
            font-size: 2rem;
            font-weight: bold;
            margin: 0 0 12px 0;
            letter-spacing: 0.5px;
        }

        .mute-hint {
            color: #8c8c8c;
            font-size: 1.35rem;
            margin: 0 0 10px 0;
            cursor: pointer;
        }

        /* Volume Slider under Click to Unmute\Mute */
        #volSlider {
            width: 130px;
            height: 6px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
            cursor: pointer;
            display: block;
            margin: 0 auto 14px auto;
        }

        #volSlider::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
            cursor: pointer;
        }

        #volSlider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .subtitle {
            color: #fff;
            font-size: 1.55rem;
            margin: 0 0 55px 0;
        }

        /* Horizontal Social Media Links */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 42px;
        }

        a {
            color: #fff;
            text-decoration: none;
            font-size: 1.4rem;
            transition: color 3.25s ease;
        }

        a:hover {
            color: #ff0000;
        }

        @media (max-width: 768px) {
            .cd-wrapper, .cd-image {
                width: 180px;
                height: 180px;
            }
            h1 {
                font-size: 2.4rem;
            }
            .mute-hint {
                font-size: 1.1rem;
            }
            .subtitle {
                font-size: 1.25rem;
                margin-bottom: 35px;
            }
            ul {
                gap: 22px;
            }
            a {
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Video (Starts only when CD is clicked) -->
    <video class="bg-video" id="bgVid" loop playsinline disablePictureInPicture preload="auto">
        <source src="1102.mp4">
    </video>

    <!-- Initial CD Image -->
    <div class="cd-wrapper" id="cdWrapper">
        <img src="cd.jpg" class="cd-image" id="cdBtn" alt="CD">
    </div>

    <!-- Main Interface -->
    <div class="content" id="mainContent">
        <h1>Hi, i'm Nawal</h1>
        <p class="mute-hint" id="muteToggle">Click to Unmute\Mute</p>
        <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
        <p class="subtitle">All you need to know</p>

        <ul>
            <li><a href="https://www.twitch.tv/nvwal" target="_blank">twitch</a></li>
            <li><a href="https://x.com/RozeLatte" target="_blank">X</a></li>
            <li><a href="https://discord.com/invite/tcKJVcmu9S" target="_blank">discord</a></li>
            <li><a href="https://tip.dokan.sa/nvwal" target="_blank">دكان تب</a></li>
            <li><a href="https://www.rankone.global/nawal" target="_blank">rankone</a></li>
        </ul>
    </div>

    <script>
        const cdWrapper = document.getElementById('cdWrapper');
        const mainContent = document.getElementById('mainContent');
        const bgVideo = document.getElementById('bgVid');
        const volSlider = document.getElementById('volSlider');
        let entered = false;

        bgVideo.volume = volSlider.value;

        // Start video with sound, slide CD left & fade out, fade in content
        cdWrapper.addEventListener('click', (e) => {
            e.stopPropagation();
            if (entered) return;
            entered = true;

            cdWrapper.classList.add('hide-left');

            bgVideo.muted = false;
            bgVideo.play().catch(err => console.log("Video play error:", err));

            setTimeout(() => {
                cdWrapper.style.display = 'none';
                bgVideo.classList.add('show');
                mainContent.classList.add('show');
            }, 500);
        });

        // Volume slider control
        volSlider.addEventListener('click', (e) => e.stopPropagation());
        volSlider.addEventListener('input', (e) => {
            bgVideo.volume = e.target.value;
            if (bgVideo.muted && e.target.value > 0) {
                bgVideo.muted = false;
            }
        });

        // Toggle Mute / Unmute when clicking anywhere after entering (except links & slider)
        document.body.addEventListener('click', (e) => {
            if (!entered) return;
            if (e.target.tagName.toLowerCase() === 'a' || e.target.id === 'volSlider') return;
            bgVideo.muted = !bgVideo.muted;
        });
    </script>

</body>
</html>
